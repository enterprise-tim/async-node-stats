name: Deploy React App to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Download latest benchmark release
        run: |
          echo "📥 Downloading latest benchmark release from enterprise-tim/als-benchmark-basic..."
          
          # Install jq for JSON parsing
          sudo apt-get update && sudo apt-get install -y jq
          
          # Get the latest release from the als-benchmark-basic repository
          LATEST_RELEASE=$(curl -s "https://api.github.com/repos/enterprise-tim/als-benchmark-basic/releases/latest" | jq -r '.tag_name // empty')
          
          if [ -n "$LATEST_RELEASE" ] && [[ "$LATEST_RELEASE" == benchmark-results-* ]]; then
            echo "Found latest benchmark release: $LATEST_RELEASE"
            
            # Download the results archive from the als-benchmark-basic repository
            echo "Downloading from: https://github.com/enterprise-tim/als-benchmark-basic/releases/download/$LATEST_RELEASE/benchmark-results.tar.gz"
            if curl -L -f -o "benchmark-results.tar.gz" "https://github.com/enterprise-tim/als-benchmark-basic/releases/download/$LATEST_RELEASE/benchmark-results.tar.gz"; then
              echo "Download successful"
              echo "Downloaded file size: $(ls -lh benchmark-results.tar.gz | awk '{print $5}')"
              echo "File type: $(file benchmark-results.tar.gz)"
            else
              echo "Download failed with exit code $?"
              echo "Checking if file exists anyway..."
              ls -la benchmark-results.tar.gz 2>/dev/null || echo "No file created"
            fi
            
            if [ -f "benchmark-results.tar.gz" ]; then
              echo "Downloaded benchmark results, extracting..."
              if tar -xzf benchmark-results.tar.gz; then
                echo "Extraction successful"
              else
                echo "Extraction failed with exit code $?"
                echo "Attempting to view file contents to debug:"
                head -c 100 benchmark-results.tar.gz | hexdump -C
              fi
              
              # Verify extracted contents
              echo "Extracted archive contents:"
              ls -la .
              
              if [ -d "results" ]; then
                echo "Results directory found with contents:"
                ls -la results/
              fi
              
              echo "Benchmark results extracted successfully"
              ls -la results/versions/ 2>/dev/null || echo "No version results found"
            else
              echo "Failed to download benchmark results"
            fi
          else
            echo "No benchmark release found in enterprise-tim/als-benchmark-basic, using existing data if available..."
          fi
        
      - name: Prepare benchmark data
        run: |
          echo "📊 Preparing benchmark data for site build..."
          echo "Current working directory: $(pwd)"
          echo "Directory contents:"
          ls -la
          
          # Create docs directory if it doesn't exist
          mkdir -p docs
          
          # Check if we have processed data already in results directory
          if [ -f "results/version-comparison.json" ]; then
            echo "✅ Found pre-processed version-comparison.json in results directory"
            echo "File size: $(ls -lh results/version-comparison.json | awk '{print $5}')"
            
            # Copy the processed files to docs directory for the build
            cp results/version-comparison.json docs/ 2>/dev/null || echo "Failed to copy version-comparison.json"
            
            # Check for other processed files
            if [ -f "results/chart-data.json" ]; then
              cp results/chart-data.json docs/ 2>/dev/null || echo "Failed to copy chart-data.json"
              echo "✅ Copied chart-data.json to docs/"
            fi
            
            if [ -f "results/detailed-results.json" ]; then
              cp results/detailed-results.json docs/ 2>/dev/null || echo "Failed to copy detailed-results.json"
              echo "✅ Copied detailed-results.json to docs/"
            fi
            
            echo "✅ Pre-processed data prepared for build"
          elif [ -d "results/versions" ] && [ "$(ls -A results/versions 2>/dev/null)" ]; then
            echo "Found raw benchmark data, but no processing scripts available"
            echo "This is expected for the display-only site"
            echo "Creating minimal directory structure for build..."
          else
            echo "No benchmark data found, creating minimal directory structure..."
          fi
          
          # Verify that the files are in the right place
          echo "🔍 Verifying files in docs directory..."
          if [ -f "docs/version-comparison.json" ]; then
            echo "✅ docs/version-comparison.json exists"
            echo "File size: $(ls -lh docs/version-comparison.json | awk '{print $5}')"
          else
            echo "❌ docs/version-comparison.json not found"
          fi
          
          if [ -f "docs/chart-data.json" ]; then
            echo "✅ docs/chart-data.json exists"
            echo "File size: $(ls -lh docs/chart-data.json | awk '{print $5}')"
          else
            echo "❌ docs/chart-data.json not found"
          fi
          
          if [ -f "docs/detailed-results.json" ]; then
            echo "✅ docs/detailed-results.json exists"
            echo "File size: $(ls -lh docs/detailed-results.json | awk '{print $5}')"
          else
            echo "❌ docs/detailed-results.json not found"
          fi
        
      - name: Build React app
        run: |
          echo "🔨 Building React application..."
          
          # Ensure required directories exist before build
          mkdir -p results docs public
          
          # Build the React app
          npm run build
          
          # Copy benchmark results and docs to build output
          if [ -d "results" ] && [ "$(ls -A results 2>/dev/null)" ]; then
            echo "📊 Copying benchmark results to build output..."
            cp -r results dist/ 2>/dev/null || echo "Failed to copy results, continuing..."
            
            # Generate data-index.json for the benchmarkData service
            echo "📋 Generating data-index.json for benchmark data service..."
            if [ -d "results/versions" ]; then
              # Create a simple data index mapping versions to their files
              echo "{" > dist/data-index.json
              first=true
              for versionDir in results/versions/node_*; do
                if [ -d "$versionDir" ]; then
                  version=$(basename "$versionDir" | sed 's/node_//')
                  benchmarkFile=$(find "$versionDir" -name "benchmark_*.json" | head -1 | xargs basename 2>/dev/null || echo "")
                  memoryFile=$(find "$versionDir" -name "memory_*.json" | head -1 | xargs basename 2>/dev/null || echo "")
                  
                  if [ "$first" = true ]; then
                    first=false
                  else
                    echo "," >> dist/data-index.json
                  fi
                  
                  echo "  \"$version\": {" >> dist/data-index.json
                  echo "    \"benchmark\": \"$benchmarkFile\"," >> dist/data-index.json
                  echo "    \"memory\": \"$memoryFile\"" >> dist/data-index.json
                  echo "  }" >> dist/data-index.json
                fi
              done
              echo "}" >> dist/data-index.json
              echo "✅ data-index.json generated successfully"
            fi
          fi
          
          if [ -d "docs" ] && [ "$(ls -A docs 2>/dev/null)" ]; then
            echo "📚 Copying documentation to build output..."
            cp -r docs dist/ 2>/dev/null || echo "Failed to copy docs, continuing..."
          fi
          
          # Copy generated JSON files to root of build output for website access
          echo "📊 Copying generated JSON files to build root..."
          if [ -f "docs/version-comparison.json" ]; then
            cp docs/version-comparison.json dist/ 2>/dev/null || echo "Failed to copy version-comparison.json, continuing..."
            echo "✅ version-comparison.json copied to dist/"
          else
            echo "⚠️  version-comparison.json not found in docs/"
          fi
          
          if [ -f "docs/chart-data.json" ]; then
            cp docs/chart-data.json dist/ 2>/dev/null || echo "Failed to copy chart-data.json, continuing..."
            echo "✅ chart-data.json copied to dist/"
          else
            echo "⚠️  chart-data.json not found in docs/"
          fi
          
          if [ -f "docs/detailed-results.json" ]; then
            cp docs/detailed-results.json dist/ 2>/dev/null || echo "Failed to copy detailed-results.json, continuing..."
            echo "✅ detailed-results.json copied to dist/"
          else
            echo "⚠️  detailed-results.json not found in docs/"
          fi
          
          echo "✅ Generated JSON files copy process completed"
          
          # Verify the files are in the right place
          echo "🔍 Verifying files in dist directory:"
          ls -la dist/ | grep -E "\.(json|html)$" || echo "No JSON or HTML files found in dist/"
          
          # Copy only specific static files from public, excluding generated data
          if [ -d "public" ] && [ "$(ls -A public 2>/dev/null)" ]; then
            echo "🌐 Copying static public files to build output..."
            
            # Copy only non-generated files
            if [ -f "public/404.html" ]; then
              cp public/404.html dist/ 2>/dev/null || echo "Failed to copy 404.html, continuing..."
            fi
            
            if [ -f "public/CNAME" ]; then
              cp public/CNAME dist/ 2>/dev/null || echo "Failed to copy CNAME, continuing..."
            fi
            
            # Copy markdown documentation files (source files, not generated)
            if [ -d "public" ]; then
              find public -name "*.md" -exec cp {} dist/ \; 2>/dev/null || echo "Failed to copy markdown files, continuing..."
            fi
            
            echo "✅ Static public files copied successfully"
          fi
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
